name: Build and smoke test sharded cis image

on:
  pull_request:
    paths: ['cis_permutations/scripts/sharded_cis.py']
  push:
    branches: [main]
    paths: ['cis_permutations/scripts/sharded_cis.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-sharded-cis" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cis_permutations/envs/Dockerfile.sharded
          platforms: linux/amd64
          load: true
          push: false
          tags: sharded-cis:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run real PLINK2, tensorQTL, and R qvalue smoke
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SHARDED_CIS_SCRIPT=/opt/tensorqtl/sharded_cis.py \
            -v "$PWD:/work:ro" -w /work/cis_permutations \
            sharded-cis:candidate python tests/smoke_sharded.py
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested commit image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker tag sharded-cis:candidate "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
